<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzas Personales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Import Map para dependencias desde CDN -->
  <script type="importmap">
    {
      "imports": {
        "@clerk/clerk-js": "https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js",
        "@libsql/client/web": "https://cdn.jsdelivr.net/npm/@libsql/client@0.14.0/web/index.js",
        "jspdf": "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.es.min.js"
      }
    }
  </script>
</head>
<body>

  <div id="app-container">

    <main id="main-content">
      <header id="view-header">

        <div id="header-actions"></div>
      </header>
      <section id="view-container">
        <!-- Las vistas se renderizan dinámicamente aquí -->
      </section>

  <!-- Carga del módulo principal -->
  <script type="module" src="src/main.js"></script>
