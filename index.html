<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzas Personales (Local)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --bg-primary: #0F172A; --bg-secondary: #1E293B; --bg-tertiary: #334155;
      --text-primary: #F8FAFC; --text-secondary: #94A3B8; --text-muted: #64748B;
      --border-subtle: #1E293B; --border-strong: #334155; --border-focus: #10B981;
      --color-primary: #10B981; --color-primary-hover: #059669;
      --color-danger: #EF4444; --color-danger-hover: #DC2626;
      --font-family: 'Inter', sans-serif;
      --fs-body: 0.875rem; --fs-h1: 1.75rem; --fs-h2: 1.25rem;
      --space-md: 1rem; --space-lg: 1.5rem; --space-xl: 2rem;
      --radius-lg: 0.75rem; --radius-sm: 0.375rem;
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-family); background: var(--bg-primary); color: var(--text-primary); font-size: var(--fs-body); height: 100vh; overflow: hidden; }
    #app { display: flex; height: 100vh; }
    #sidebar { width: 220px; background: var(--bg-secondary); padding: var(--space-lg) var(--space-md); display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); }
    #sidebar .logo { font-size: var(--fs-h2); font-weight: 700; color: var(--color-primary); margin-bottom: var(--space-lg); }
    #sidebar nav ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-xs); }
    #sidebar nav ul li { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); transition: 0.2s; }
    #sidebar nav ul li:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    #sidebar nav ul li.active { background: var(--bg-tertiary); color: var(--color-primary); }
    #sidebar .user-profile { margin-top: auto; padding-top: var(--space-md); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; gap: var(--space-md); }
    #sidebar .user-profile .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-weight: 600; }
    #main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    #header { padding: var(--space-lg) var(--space-xl); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    #header h1 { font-size: var(--fs-h1); }
    #content { padding: var(--space-xl); max-width: 1200px; margin: 0 auto; width: 100%; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-md); }
    .card { background: var(--bg-secondary); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: var(--space-lg); box-shadow: var(--shadow-md); }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-title { color: var(--text-secondary); }
    .card-amount { font-size: var(--fs-h1); font-weight: 700; }
    .card-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-sm); }
    .btn { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-sm); border: none; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--color-primary); color: #000; }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-danger { background: transparent; border: 1px solid var(--color-danger); color: var(--color-danger); }
    .btn-danger:hover { background: var(--color-danger); color: #000; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-strong); color: var(--text-secondary); }
    .btn-icon { background: none; border: none; color: var(--text-secondary); cursor: pointer; }
    input, select { background: var(--bg-tertiary); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-primary); padding: var(--space-sm) var(--space-md); width: 100%; outline: none; }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
    .modal-overlay { position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal-content { background: var(--bg-secondary); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: var(--space-xl); max-width: 500px; width: 90%; }
    .modal-content .form-group { margin-bottom: var(--space-md); }
    .modal-content .form-group label { display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); }
    .modal-content .form-actions { display: flex; gap: var(--space-sm); justify-content: flex-end; margin-top: var(--space-md); }
    .expense-row { display: flex; justify-content: space-between; padding: var(--space-sm); border-bottom: 1px solid var(--border-subtle); align-items: center; }
    @media (max-width: 768px) {
      #sidebar { width: 60px; padding: var(--space-sm); }
      #sidebar .logo, #sidebar .user-profile span, #sidebar nav ul li span { display: none; }
      #content { padding: var(--space-md); }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">💰</div>
    <nav><ul id="nav-list"></ul></nav>
    <div class="user-profile"><div class="avatar">L</div><span>Local</span></div>
  </aside>
  <main id="main">
    <header id="header"><h1 id="view-title">Dashboard</h1></header>
    <section id="content"></section>
  </main>
</div>

<script>
// ============================================================
// 1. ALMACENAMIENTO LOCAL (simula base de datos)
// ============================================================
const DB = {
  get(key) {
    try {
      return JSON.parse(localStorage.getItem(key)) || [];
    } catch { return []; }
  },
  set(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  },
  // Genera IDs secuenciales (simula AUTOINCREMENT)
  nextId(collection) {
    const items = this.get(collection);
    const max = items.reduce((max, item) => Math.max(max, item.id || 0), 0);
    return max + 1;
  }
};

// Colecciones
const COLLECTIONS = {
  pockets: 'pockets',
  movements: 'movements',
  categories: 'categories',
  expenses: 'expenses',
  subExpenses: 'subExpenses',
  subscriptions: 'subscriptions',
  investments: 'investments',
  debts: 'debts'
};

// Inicializar categorías por defecto si no existen
function initCategories() {
  let cats = DB.get(COLLECTIONS.categories);
  if (cats.length === 0) {
    cats = [
      { id: 1, name: 'Tarjeta 1' },
      { id: 2, name: 'Débito' },
      { id: 3, name: 'Efectivo' }
    ];
    DB.set(COLLECTIONS.categories, cats);
  }
}
initCategories();

// ============================================================
// 2. UTILIDADES DOM
// ============================================================
function el(tag, cls='', attrs={}, children=[]) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'textContent') e.textContent = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  children.forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return e;
}
function append(parent, ...children) { children.forEach(c => parent.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)); return parent; }
function clear(el) { el.innerHTML = ''; }
function showModal(title, html, onConfirm, confirmText='Confirmar', cancelText='Cancelar') {
  const overlay = el('div', 'modal-overlay');
  const modal = el('div', 'modal-content');
  const h2 = el('h2', '', { textContent: title });
  const body = el('div', 'modal-body', { innerHTML: html });
  const actions = el('div', 'form-actions');
  const btnCancel = el('button', 'btn btn-secondary', { textContent: cancelText });
  const btnConfirm = el('button', 'btn btn-primary', { textContent: confirmText });
  btnCancel.onclick = () => document.body.removeChild(overlay);
  btnConfirm.onclick = () => { if(onConfirm) onConfirm(); document.body.removeChild(overlay); };
  append(actions, btnCancel, btnConfirm);
  append(modal, h2, body, actions);
  append(overlay, modal);
  document.body.appendChild(overlay);
  return overlay;
}
function formatCurrency(v) {
  return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(v);
}
function formatDate(d) {
  const dt = new Date(d);
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}
function today() {
  return new Date().toISOString().split('T')[0];
}

// ============================================================
// 3. VISTAS
// ============================================================
const views = {};

// --- Bolsillos ---
views.bolsillos = function(container) {
  const pockets = DB.get(COLLECTIONS.pockets);
  const grid = el('div', 'cards-grid');
  for (const pocket of pockets) {
    const movements = DB.get(COLLECTIONS.movements).filter(m => m.pocketId === pocket.id);
    const balance = movements.reduce((acc, m) => acc + m.amount, 0);
    const card = el('div', 'card');
    const header = el('div', 'card-header');
    append(header, el('span', 'card-title', { textContent: pocket.name }));
    const actions = el('div', 'card-actions');
    const editBtn = el('button', 'btn-icon', { textContent: '✏️' });
    const delBtn = el('button', 'btn-icon', { textContent: '🗑️' });
    append(actions, editBtn, delBtn);
    append(header, actions);
    const amount = el('div', 'card-amount', { textContent: formatCurrency(balance) });
    const btnRow = el('div', 'card-actions');
    const addBtn = el('button', 'btn btn-primary', { textContent: '+ Añadir' });
    const withdrawBtn = el('button', 'btn btn-danger', { textContent: '- Retirar' });
    append(btnRow, addBtn, withdrawBtn);
    append(card, header, amount, btnRow);
    grid.appendChild(card);

    // Eventos
    editBtn.onclick = () => {
      showModal('Editar Bolsillo', `<input id="edit-name" value="${pocket.name}">`, () => {
        const newName = document.getElementById('edit-name').value.trim();
        if (newName) {
          const updated = pockets.map(p => p.id === pocket.id ? { ...p, name: newName } : p);
          DB.set(COLLECTIONS.pockets, updated);
          renderView('bolsillos');
        }
      });
    };
    delBtn.onclick = () => { 
      if (confirm('Eliminar bolsillo?')) {
        const updated = pockets.filter(p => p.id !== pocket.id);
        DB.set(COLLECTIONS.pockets, updated);
        renderView('bolsillos');
      }
    };
    addBtn.onclick = () => {
      showModal('Añadir dinero', `<input id="mov-amount" type="number" step="0.01" placeholder="Monto"><input id="mov-desc" placeholder="Descripción">`, () => {
        const amount = parseFloat(document.getElementById('mov-amount').value);
        const desc = document.getElementById('mov-desc').value.trim();
        if (!isNaN(amount) && amount > 0) {
          const movs = DB.get(COLLECTIONS.movements);
          const newMov = {
            id: DB.nextId(COLLECTIONS.movements),
            pocketId: pocket.id,
            amount,
            description: desc || 'Añadido',
            date: today()
          };
          movs.push(newMov);
          DB.set(COLLECTIONS.movements, movs);
          renderView('bolsillos');
        }
      });
    };
    withdrawBtn.onclick = () => {
      showModal('Retirar dinero', `<input id="mov-amount" type="number" step="0.01" placeholder="Monto"><input id="mov-desc" placeholder="Descripción">`, () => {
        const amount = parseFloat(document.getElementById('mov-amount').value);
        const desc = document.getElementById('mov-desc').value.trim();
        if (!isNaN(amount) && amount > 0) {
          const movs = DB.get(COLLECTIONS.movements);
          const newMov = {
            id: DB.nextId(COLLECTIONS.movements),
            pocketId: pocket.id,
            amount: -amount,
            description: desc || 'Retirado',
            date: today()
          };
          movs.push(newMov);
          DB.set(COLLECTIONS.movements, movs);
          renderView('bolsillos');
        }
      });
    };
  }
  const addPocket = el('button', 'btn btn-primary', { textContent: '+ Nuevo Bolsillo' });
  addPocket.onclick = () => {
    showModal('Nuevo Bolsillo', `<input id="new-pocket-name" placeholder="Nombre">`, () => {
      const name = document.getElementById('new-pocket-name').value.trim();
      if (name) {
        const pockets = DB.get(COLLECTIONS.pockets);
        const newPocket = { id: DB.nextId(COLLECTIONS.pockets), name };
        pockets.push(newPocket);
        DB.set(COLLECTIONS.pockets, pockets);
        renderView('bolsillos');
      }
    });
  };
  append(container, grid, addPocket);
};

// --- Gastos ---
views.gastos = function(container) {
  const categories = DB.get(COLLECTIONS.categories);
  const expenses = DB.get(COLLECTIONS.expenses).filter(e => !e.archived);
  const list = el('div');
  for (const exp of expenses) {
    const row = el('div', 'expense-row');
    const info = el('span', '', { textContent: `${formatDate(exp.date)} - ${exp.description} - ${formatCurrency(exp.amount)}` });
    const actions = el('span');
    const archiveBtn = el('button', 'btn-icon', { textContent: '📁' });
    archiveBtn.onclick = () => {
      const updated = DB.get(COLLECTIONS.expenses).map(e => e.id === exp.id ? { ...e, archived: true } : e);
      DB.set(COLLECTIONS.expenses, updated);
      renderView('gastos');
    };
    append(actions, archiveBtn);
    append(row, info, actions);
    list.appendChild(row);
  }
  const addBtn = el('button', 'btn btn-primary', { textContent: '+ Nuevo Gasto' });
  addBtn.onclick = () => {
    const catOptions = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    showModal('Nuevo Gasto', `
      <div class="form-group"><label>Descripción</label><input id="exp-desc"></div>
      <div class="form-group"><label>Monto</label><input id="exp-amount" type="number" step="0.01"></div>
      <div class="form-group"><label>Categoría</label><select id="exp-cat">${catOptions}</select></div>
      <div class="form-group"><label>Fecha</label><input id="exp-date" type="date" value="${today()}"></div>
    `, () => {
      const desc = document.getElementById('exp-desc').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value);
      const catId = parseInt(document.getElementById('exp-cat').value);
      const date = document.getElementById('exp-date').value;
      if (desc && !isNaN(amount) && amount > 0 && catId) {
        const exps = DB.get(COLLECTIONS.expenses);
        const newExp = {
          id: DB.nextId(COLLECTIONS.expenses),
          description: desc,
          amount,
          categoryId: catId,
          date,
          completed: false,
          archived: false
        };
        exps.push(newExp);
        DB.set(COLLECTIONS.expenses, exps);
        renderView('gastos');
      }
    });
  };
  append(container, list, addBtn);
};

// --- Suscripciones ---
views.suscripciones = function(container) {
  const subs = DB.get(COLLECTIONS.subscriptions);
  const list = el('div');
  for (const s of subs) {
    const row = el('div', 'expense-row');
    append(row, el('span', '', { textContent: `${s.name} - ${formatCurrency(s.amount)} / ${s.frequency}` }));
    const del = el('button', 'btn btn-danger', { textContent: 'Eliminar' });
    del.onclick = () => {
      if (confirm('Eliminar suscripción?')) {
        const updated = subs.filter(sub => sub.id !== s.id);
        DB.set(COLLECTIONS.subscriptions, updated);
        renderView('suscripciones');
      }
    };
    append(row, del);
    list.appendChild(row);
  }
  const addBtn = el('button', 'btn btn-primary', { textContent: '+ Nueva Suscripción' });
  addBtn.onclick = () => {
    showModal('Nueva Suscripción', `
      <div class="form-group"><label>Nombre</label><input id="sub-name"></div>
      <div class="form-group"><label>Monto</label><input id="sub-amount" type="number" step="0.01"></div>
      <div class="form-group"><label>Frecuencia</label>
        <select id="sub-freq"><option value="diario">Diario</option><option value="semanal">Semanal</option><option value="quincenal">Quincenal</option><option value="mensual" selected>Mensual</option><option value="anual">Anual</option></select>
      </div>
      <div class="form-group"><label>Día de cobro</label><input id="sub-charge" type="number" min="1" max="31" value="1"></div>
    `, () => {
      const name = document.getElementById('sub-name').value.trim();
      const amount = parseFloat(document.getElementById('sub-amount').value);
      const freq = document.getElementById('sub-freq').value;
      const charge = document.getElementById('sub-charge').value;
      if (name && !isNaN(amount) && amount > 0 && charge) {
        const subs = DB.get(COLLECTIONS.subscriptions);
        const newSub = {
          id: DB.nextId(COLLECTIONS.subscriptions),
          name,
          amount,
          frequency: freq,
          chargeDate: charge
        };
        subs.push(newSub);
        DB.set(COLLECTIONS.subscriptions, subs);
        renderView('suscripciones');
      }
    });
  };
  append(container, list, addBtn);
};

// ============================================================
// 4. NAVEGACIÓN
// ============================================================
const navItems = [
  { id: 'bolsillos', label: '💰 Bolsillos' },
  { id: 'gastos', label: '💳 Gastos' },
  { id: 'suscripciones', label: '🔄 Suscripciones' },
];

const sidebarNav = document.getElementById('nav-list');
const content = document.getElementById('content');
const viewTitle = document.getElementById('view-title');

function renderNav(activeView) {
  clear(sidebarNav);
  navItems.forEach(item => {
    const li = el('li', item.id === activeView ? 'active' : '', { textContent: item.label });
    li.dataset.view = item.id;
    li.onclick = () => renderView(item.id);
    sidebarNav.appendChild(li);
  });
}

function renderView(viewId) {
  if (!views[viewId]) {
    content.innerHTML = `<p>Vista en construcción: ${viewId}</p>`;
    return;
  }
  viewTitle.textContent = navItems.find(v => v.id === viewId)?.label || viewId;
  renderNav(viewId);
  clear(content);
  try {
    views[viewId](content);
  } catch (e) {
    console.error(e);
    content.innerHTML = `<p>Error: ${e.message}</p>`;
  }
}

// ============================================================
// 5. INICIO
// ============================================================
renderView('bolsillos');
</script>
</body>
</html>
